<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="shadow p-3 rounded-5" style="width: 350px; background-color: black;">
            <input id="input" type="text" class="form-control text-end fs-2 mb-3 rounded-5" placeholder="0">
            <div class="row g-2">
                <div class="col-3">
                    <button id="ac"  onclick="clearAll()" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(197, 78, 32);" >AC</button>
                </div>
                <div class="col-3">
                    <button id="delete" class="btn w-100 fs-4 rounded-circle" style="background-color: rgb(197, 78, 32);">DEL</button>
                </div>
                <div class="col-3">
                    <button id="persentage" onclick="displayData('%')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(123, 192, 238);">%</button>
                </div>
                <div class="col-3">
                    <button id="division" onclick="displayData('/')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(123, 192, 238);">/</button>
                </div>
                <div class="col-3">
                    <button id="seven" onclick="displayData('7')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41)">7</button>
                </div>
                <div class="col-3">
                    <button id="eight" onclick="displayData('8')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">8</button>
                </div>
                <div class="col-3">
                    <button id="nine" onclick="displayData('9')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">9</button>
                </div>
                <div class="col-3">
                    <button id="multiply" onclick="displayData('*')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(123, 192, 238)">x</button>
                </div>
                <div class="col-3">
                    <button id="four" onclick="displayData('4')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">4</button>
                </div>
                <div class="col-3">
                    <button id="five" onclick="displayData('5')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">5</button>
                </div>
                <div class="col-3">
                    <button id="six" onclick="displayData('6')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">6</button>
                </div>
                <div class="col-3">
                    <button id="minus" onclick="displayData('-')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(123, 192, 238);">-</button>
                </div>
                <div class="col-3">
                    <button id="one" onclick="displayData('1')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">1</button>
                </div>
                <div class="col-3">
                    <button id="two" onclick="displayData('2')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">2</button>
                </div>
                <div class="col-3">
                    <button id="three" onclick="displayData('3')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">3</button>
                </div>
                <div class="col-3">
                    <button id="add" onclick="displayData('+')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(123, 192, 238);">+</button>
                </div>
                <div class="col-6">
                    <button id="zero" onclick="displayData('0')" class="btn w-100 fs-4 rounded-pill" style="background-color:rgb(70, 212, 41);">0</button>
                </div>
                <div class="col-3">
                    <button id="point" onclick="displayData('.')" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(70, 212, 41);">.</button>
                </div>
                <div class="col-3">
                    <button id="equals" class="btn w-100 fs-4 rounded-circle" style="background-color:rgb(37, 107, 236);" onclick="Result()">=</button>
                </div>
            </div>
        </div>
    </div>
</body>
 <script src="./script.js"></script>
</html>
